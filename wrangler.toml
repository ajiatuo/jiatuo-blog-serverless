# jiatuo-blog-serverless · Cloudflare Worker 配置
# 复制为 wrangler.toml 后填入你的真实值，或直接参考 wrangler.example.toml

name = "jiatuo-blog-serverless"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

# 前端静态资源（Vite 构建产物），SPA fallback 到 index.html
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# D1 数据库（部署时填入真实 database_id）
[[d1_databases]]
binding = "DB"
database_name = "jiatuo-blog"
database_id = "YOUR_D1_DATABASE_ID_HERE"

# R2 素材桶（部署时填入真实 bucket 名）
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "jiatuo-blog-media"

# 公开变量（部署时按实际域名修改）
[vars]
APP_URL = "https://your-domain.com"
ENVIRONMENT = "production"

# 机密（用 wrangler secret put 设置，不写在这里）：
#   AUTH_SECRET  - 登录会话密钥（至少 32 位随机字符串）
#   SETUP_TOKEN  - 可选；不设则首次自动生成并打印到日志
